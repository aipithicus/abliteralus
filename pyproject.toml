[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "abliteralus"
version = "0.1.2"
description = "Master Ablation Suite for HuggingFace transformers"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["abliteration", "mechanistic-interpretability", "refusal-removal", "llm", "transformers", "alignment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "datasets>=2.14",
    "accelerate>=0.24",
    "safetensors>=0.4",
    "pyyaml>=6.0",
    "rich>=13.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "tqdm>=4.64",
]

[project.urls]
"Homepage" = "https://github.com/elder-plinius/ABLITERALUS"
"Repository" = "https://github.com/elder-plinius/ABLITERALUS"
"Bug Tracker" = "https://github.com/elder-plinius/ABLITERALUS/issues"

[project.scripts]
abliteralus-surgery = "abliteralus.surgery_bench:main"
abliteralus-lightning = "abliteralus.lightning_surgery:main"

[project.optional-dependencies]
dev = [
    "build==1.2.2.post1",
    "hypothesis==6.165.3",
    "mypy==1.13.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.2",
]
quantization = ["bitsandbytes>=0.46.1"]
spaces = ["gradio>=6.7,<7.0"]
lightning = ["lightning-sdk==2026.8.18; python_version >= '3.11'"]
gguf = [
    "protobuf==4.25.8",
    "sentencepiece==0.2.1",
]

[dependency-groups]
ci = [
    "build==1.2.2.post1",
    "pip-licenses==5.5.5",
    "twine==7.0.0",
]
quality = [
    "mutmut==3.7.0",
]
mlx = [
    "mlx==0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.setuptools]
# The local UI launcher imports the Hugging Face Spaces application module.
# Include that top-level module in wheels as well as editable/source installs.

[tool.setuptools.packages.find]
include = ["abliteralus*"]

[tool.setuptools.package-data]
abliteralus = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-p",
    "no:cacheprovider",
    "--basetemp=.scratch/pytest",
    "--cov=abliteralus",
    "--cov-report=term-missing",
    "--cov-fail-under=75",
]
filterwarnings = [
    "error",
]
markers = [
    "cpu: deterministic tests supported by the mandatory CPU-only gate",
    "integration: offline integration tests spanning multiple components",
    "slow: tests excluded from the fast pull-request gate because of runtime",
    "gpu: tests that require a CUDA-capable runner",
    "mps: tests that require Apple Metal Performance Shaders",
    "mlx: tests that require Apple MLX",
    "network: tests that access external network resources",
    "download: tests that download model or dataset artifacts",
    "remote: tests that require a remote execution provider or credentials",
    "operator_ui: tests that require the optional UI runtime",
]

[tool.mutmut]
source_paths = ["abliteralus/", "scripts/"]
only_mutate = [
    "abliteralus/config.py",
    "abliteralus/analysis/numerical_contracts.py",
    "abliteralus/analysis/whitened_svd.py",
    "abliteralus/runtime_contracts.py",
    "abliteralus/persistence_contracts.py",
    "abliteralus/remote_contracts.py",
    "abliteralus/service_contracts.py",
    "abliteralus/tourney_contracts.py",
    "abliteralus/evaluation/lm_eval_integration.py",
    "scripts/check_coverage_thresholds.py",
]
required_mutation_targets = [
    "abliteralus/analysis/numerical_contracts.py",
    "abliteralus/analysis/whitened_svd.py",
    "abliteralus/persistence_contracts.py",
    "abliteralus/runtime_contracts.py",
    "abliteralus/service_contracts.py",
    "abliteralus/tourney_contracts.py",
]
pytest_add_cli_args = ["--no-cov", "-q"]
pytest_add_cli_args_test_selection = [
    "tests/test_config.py",
    "tests/test_config_properties.py",
    "tests/test_bestiary_contracts.py",
    "tests/test_coverage_thresholds.py",
    "tests/test_projection_math_contracts.py",
    "tests/test_lm_eval_reporting_contracts.py",
    "tests/test_models_client_contracts.py",
    "tests/test_numerical_contracts.py",
    "tests/test_checkpoint_atomicity.py",
    "tests/test_persistence_contracts.py",
    "tests/test_persistence_pipeline.py",
    "tests/test_remote_contracts.py",
    "tests/test_runtime_contracts.py",
    "tests/test_tourney_contracts.py",
    "tests/test_watchtower_contracts.py",
    "tests/test_whitened_svd_oracles.py",
]
mutate_only_covered_lines = true
timeout_constant = 2.0
on_dependency_change = "rerun"

[tool.uv]
environments = [
  "sys_platform == 'win32' and os_name == 'nt'",
  "sys_platform != 'win32' and os_name == 'posix'",
]
constraint-dependencies = [
    "accelerate==1.14.0",
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.3",
    "aiosignal==1.4.0",
    "annotated-doc==0.0.5",
    "anyio==4.14.2",
    "async-timeout==5.0.1 ; python_full_version < '3.11'",
    "attrs==26.1.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.4.9",
    "click==8.4.2",
    "colorama==0.4.6 ; sys_platform == 'win32'",
    "contourpy==1.3.2 ; python_full_version < '3.11'",
    "contourpy==1.3.3 ; python_full_version >= '3.11'",
    "cycler==0.12.1",
    "datasets==5.0.1",
    "dill==0.4.1",
    "exceptiongroup==1.3.1 ; python_full_version < '3.11'",
    "filelock==3.32.2",
    "fonttools==4.63.0",
    "frozenlist==1.8.0",
    "fsspec==2026.6.0",
    "h11==0.16.0",
    "hf-xet==1.6.0 ; platform_machine == 'AMD64' or platform_machine == 'aarch64' or platform_machine == 'amd64' or platform_machine == 'arm64' or platform_machine == 'x86_64'",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface-hub==1.27.0",
    "idna==3.18",
    "jinja2==3.1.6",
    "joblib==1.5.3",
    "kiwisolver==1.5.0",
    "markdown-it-py==4.2.0",
    "markupsafe==2.1.5",
    "matplotlib==3.10.9 ; python_full_version < '3.11'",
    "matplotlib==3.11.1 ; python_full_version >= '3.11'",
    "mdurl==0.1.2",
    "mpmath==1.3.0",
    "multidict==6.7.1",
    "multiprocess==0.70.19",
    "narwhals==2.24.0 ; python_full_version >= '3.11'",
    "networkx==3.4.2 ; python_full_version < '3.11'",
    "networkx==3.6.1 ; python_full_version >= '3.11'",
    "numpy==2.2.6 ; python_full_version < '3.11'",
    "numpy==2.4.6 ; python_full_version == '3.11.*'",
    "numpy==2.5.2 ; python_full_version >= '3.12'",
    "packaging==26.3",
    "pandas==2.3.3",
    "pillow==12.3.0",
    "pillow>=12.2.0",
    "propcache==0.5.2",
    "psutil==7.2.2",
    "pyarrow==25.0.1",
    "pygments==2.20.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.3.post1",
    "pyyaml==6.0.3",
    "regex==2026.7.19",
    "requests==2.34.2",
    "rich==15.0.0",
    "safetensors==0.8.0",
    "scikit-learn==1.7.2 ; python_full_version < '3.11'",
    "scikit-learn==1.9.0 ; python_full_version >= '3.11'",
    "scipy==1.15.3 ; python_full_version < '3.11'",
    "scipy==1.17.1 ; python_full_version == '3.11.*'",
    "scipy==1.18.0 ; python_full_version >= '3.12'",
    "seaborn==0.13.2",
    "setuptools==84.0.0",
    "shellingham==1.5.4",
    "six==1.17.0",
    "sympy==1.14.0",
    "threadpoolctl==3.6.0",
    "tokenizers==0.22.2",
    "torch==2.13.0",
    "tqdm==4.70.0",
    "transformers==5.15.0",
    "typer==0.27.1",
    "typing-extensions==4.16.0",
    "tzdata==2026.3",
    "urllib3==2.5.0",
    "xxhash==3.8.1",
    "yarl==1.24.5",
]
exclude-newer = "3 days"

[tool.uv.sources]
torch = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aipithicus-research-journal"
version = "0.1.0"
description = "Portable, append-only JSONL research journals with integrity verification"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Aipithicus Enterprises" }]
dependencies = [
  "filelock>=3.13,<4",
]

[project.scripts]
research-journal = "research_journal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_journal = ["schemas/*.json"]

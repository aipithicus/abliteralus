schema_version = 1
repository = "../.."
python = "../.venv/Scripts/python.exe"
secret_config = "secrets.local.toml"

[profiles]
local_surgery = "local-surgery"
local_inference = "local-inference"
lightning_control = "lightning-control"
lightning_surgery = "lightning-surgery"
lightning_inference = "lightning-inference"

[lightning]
teamspace = "OWNER/TEAMSPACE"
studio = "abliteralus-lab"
control_machine = "CPU-4"
surgery_machine = "L40S"
inference_machine = "L40S"
remote_root = ".abliteralus"
forward_environment = ["HF_TOKEN"]
allocation_timeout_seconds = 900
allocation_retry_seconds = 30
pending_policy = "fail"
# Fallbacks are opt-in. Leave these empty for strict machine selection.
surgery_fallback_machines = []
inference_fallback_machines = []
# Remote compute leases; override per command when an experiment needs a different bound.
control_max_runtime_seconds = 3600
surgery_max_runtime_seconds = 14400
inference_max_runtime_seconds = 3600

[artifacts]
# Durable local storage. Lightning remains compute and staging, not the registry.
registry = "../../outputs/artifact-registry"

[journal]
# Private local research history. Sharing is always a separate, explicit action.
path = "../../outputs/research-journal/journal.jsonl"

[ssh]
executable = "ssh"
destination = ""
port = 22
identity_file = ""

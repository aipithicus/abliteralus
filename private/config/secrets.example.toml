schema_version = 1

[providers.proton]
type = "proton-pass"
executable = "pass-cli"
timeout_seconds = 5.0

[credentials.lightning-user-id]
provider = "proton"
vault = "REPLACE_WITH_VAULT_SHARE_ID"
item = "REPLACE_WITH_ITEM_ID"
field = "secret"
description = "Lightning SDK user ID"

[credentials.lightning-api-key]
provider = "proton"
vault = "REPLACE_WITH_VAULT_SHARE_ID"
item = "REPLACE_WITH_ITEM_ID"
field = "secret"
description = "Lightning SDK API key"

[credentials.hf-local-read]
provider = "proton"
vault = "REPLACE_WITH_VAULT_SHARE_ID"
item = "REPLACE_WITH_ITEM_ID"
field = "secret"
description = "Read-only Hugging Face token for the local bench"

[credentials.hf-lightning-read]
provider = "proton"
vault = "REPLACE_WITH_VAULT_SHARE_ID"
item = "REPLACE_WITH_ITEM_ID"
field = "secret"
description = "Read-only Hugging Face token forwarded transiently to Lightning"

[credentials.hf-admin]
provider = "proton"
vault = "REPLACE_WITH_VAULT_SHARE_ID"
item = "REPLACE_WITH_ITEM_ID"
field = "secret"
privileged = true
description = "Administrative Hugging Face token; never broker-enabled"

[profiles.local-surgery]
description = "Local model download and surgery"
environment = { HF_TOKEN = "hf-local-read" }

[profiles.local-inference]
description = "Local model download and brief inference"
environment = { HF_TOKEN = "hf-local-read" }

[profiles.lightning-control]
description = "Lightning Studio lifecycle and metadata"
environment = { LIGHTNING_USER_ID = "lightning-user-id", LIGHTNING_API_KEY = "lightning-api-key" }

[profiles.lightning-surgery]
description = "Lightning surgery plus transient Hugging Face download access"
environment = { LIGHTNING_USER_ID = "lightning-user-id", LIGHTNING_API_KEY = "lightning-api-key", HF_TOKEN = "hf-lightning-read" }

[profiles.lightning-inference]
description = "Lightning inference plus transient Hugging Face download access"
environment = { LIGHTNING_USER_ID = "lightning-user-id", LIGHTNING_API_KEY = "lightning-api-key", HF_TOKEN = "hf-lightning-read" }

[profiles.hf-admin]
description = "Explicitly gated administrative Hugging Face work"
environment = { HF_TOKEN = "hf-admin" }

[broker]
default_profile = "local-inference"
allowed_profiles = ["local-surgery", "local-inference"]

# shadow_sync manifest — what flows from the public fork into this lab, and how.
# Paths are fork-relative, forward slashes. Globs: * matches within a segment, ** spans segments.
# A fork file matching neither [include] nor [exclude] is reported as UNMAPPED and not copied.

[fork]
path = "D:/aipithicus/contributing/OBLITERATUS"
upstream_remote = "upstream"
upstream_branch = "main"

[rename]
# Whole-token, three-case substitution (obliteratus / Obliteratus / OBLITERATUS), applied to
# file contents and path segments. Underscore neighbours count as part of the token so that
# identifiers such as _obliteratus_dequantized_scheme are renamed consistently.
from = "obliteratus"
to = "abliteralus"

[torch]
# The only dependency difference from the fork: torch source index. Version stays pinned to the
# fork's locked version via the generated constraints. Adjust the CUDA tag to your driver.
index_name = "pytorch-cuda"
index_url = "https://download.pytorch.org/whl/cu130"


[seams]
# Inline imports of these modules are rewritten, in place and preserving indentation, into
# same-named sentinels that raise abliteralus._lab_airgap.DisabledError when used. Local-path
# code paths keep working; hub-ID paths fail loudly.
network_modules = ["huggingface_hub", "datasets", "requests"]
# Tests importing these excluded top-level packages of the fork are pruned as well.
prune_references = ["scripts", "app"]
# After seams, no import of these may remain anywhere in the package (hard assertion).
forbidden_after = ["huggingface_hub", "datasets", "requests", "subprocess", "socket", "urllib", "http"]

[seams.replace_files]
# fork path -> stub (relative to this directory). Whole-file replacements.
"obliteratus/credential_sources.py" = "stubs/credential_sources.py"

[seams.inject_files]
# lab path (fork-relative naming, pre-rename) -> source stub. Added files that do not exist upstream.
"obliteratus/_lab_airgap.py" = "stubs/_lab_airgap.py"

[pyproject]
# Line-anchored edits to the transformed pyproject. Every anchor must match exactly once.
drop_sections = ["project.scripts"]
drop_line_prefixes = ["py-modules = ", "license = ", "license-files = "]

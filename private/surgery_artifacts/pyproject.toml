[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aipithicus-surgery-artifacts"
version = "0.1.0"
description = "Exact, content-addressed model surgery capsules for ABLITERALUS"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Aipithicus Enterprises" }]
dependencies = [
  "safetensors>=0.4",
  "torch>=2.0",
]

[project.scripts]
surgery-artifact = "surgery_artifacts.cli:main"

[project.entry-points."abliteralus.artifact_backends"]
capsule-v1 = "surgery_artifacts.integration:run_artifact_stage"

[tool.setuptools.packages.find]
where = ["src"]

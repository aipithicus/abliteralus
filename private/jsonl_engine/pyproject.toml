[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aipithicus-jsonl-engine"
version = "0.1.0"
description = "Transactional, append-oriented JSONL stores"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Aipithicus Enterprises" }]
dependencies = [
  "filelock>=3.13,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jsonl_engine = ["schemas/*.json"]

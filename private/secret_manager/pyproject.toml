[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aipithicus-secret-manager"
version = "0.1.0"
description = "Profile-based ephemeral secret delivery for local research tools"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Aipithicus Enterprises" }]
dependencies = []

[project.scripts]
secret-manager = "secret_manager.cli:main"
secret-broker = "secret_manager.broker:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aipithicus-abliteralus-lab"
version = "0.1.0"
description = "Private research, experiment, and operations modules for ABLITERALUS"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Aipithicus Enterprises" }]
dependencies = [
  "abliteralus",
  "filelock>=3.13,<4",
  "lightning-sdk==2026.8.18",
  "pyyaml>=6.0",
  "safetensors>=0.4",
  "torch>=2.0",
]

[project.scripts]
abliteralus-lightning = "lab_bench.lightning:main"
guard-study = "guard_study.cli:main"
lab-bench = "lab_bench.cli:main"
research-journal = "research_journal.cli:main"
secret-broker = "secret_manager.broker:main"
secret-manager = "secret_manager.cli:main"
stimulus-corpus = "stimulus_corpus.cli:main"
surgery-artifact = "surgery_artifacts.cli:main"

[project.entry-points."abliteralus.artifact_backends"]
capsule-v1 = "surgery_artifacts.integration:run_artifact_stage"

[dependency-groups]
dev = ["abliteralus[dev]"]

[tool.uv]
environments = [
  "sys_platform == 'win32' and os_name == 'nt'",
  "sys_platform != 'win32' and os_name == 'posix'",
]

[tool.uv.sources]
abliteralus = { path = "..", editable = true }
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jsonl_engine = ["schemas/*.json"]
research_journal = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra", "-p", "no:cacheprovider"]
pythonpath = ["src", ".."]
testpaths = ["tests"]
markers = [
  "cpu: deterministic tests that do not require a model, GPU, network, or remote service",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F"]

[tool.uv.workspace]
members = ["secret_manager", "surgery_artifacts", "lab_bench"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra", "-p", "no:cacheprovider"]
pythonpath = ["secret_manager/src", "surgery_artifacts/src", "lab_bench/src", ".."]
testpaths = ["secret_manager/tests", "surgery_artifacts/tests", "lab_bench/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.workspace]
members = [
  "secret_manager",
  "surgery_artifacts",
  "research_journal",
  "guard_study",
  "lab_bench",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra", "-p", "no:cacheprovider"]
pythonpath = [
  "secret_manager/src",
  "surgery_artifacts/src",
  "research_journal/src",
  "lab_bench/src",
  "guard_study/src",
  "..",
]
testpaths = [
  "secret_manager/tests",
  "surgery_artifacts/tests",
  "research_journal/tests",
  "lab_bench/tests",
  "guard_study/tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
